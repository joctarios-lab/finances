<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças da Família</title>
<meta name="description" content="Gestão financeira da família — offline, rápida e sincronizada.">
<meta name="theme-color" content="#1e1e2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- CSS da propria ApexCharts. O .min.js NAO o injeta: sem ele a dica de valor
     perde a caixa e o ancoramento (.apexcharts-canvas{position:relative}) e voa
     para o canto da pagina. Vem ANTES do nosso, para o nosso poder sobrepor. -->
<link rel="stylesheet" href="vendor/apexcharts.css?v=151">
<link rel="stylesheet" href="css/styles.css?v=151">
</head>
<body>

<div id="app">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="icons/icon-192.png" alt="">
      <div><b>Finanças</b><small id="side-family">Minha família</small></div>
    </div>
    <nav class="sidebar-menu">
      <p class="sidebar-section">Visão</p>
      <button class="side-item" data-tab="inicio"><span class="tab-ico" data-ico="home"></span>Painel</button>
      <button class="side-item" data-tab="extrato"><span class="tab-ico" data-ico="list"></span>Extrato</button>
      <button class="side-item" data-tab="relatorios"><span class="tab-ico" data-ico="pie"></span>Relatórios</button>
      <p class="sidebar-section">Gestão</p>
      <button class="side-item" data-tab="cartoes"><span class="tab-ico" data-ico="card"></span>Cartões &amp; Faturas</button>
      <button class="side-item" data-tab="metas"><span class="tab-ico" data-ico="target"></span>Metas</button>
      <p class="sidebar-section">Sistema</p>
      <button class="side-item" id="side-config"><span class="tab-ico" data-ico="settings"></span>Configurações</button>
      <button class="side-item" id="side-lock"><span class="tab-ico" data-ico="lock"></span>Bloquear</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">F</div>
        <div><b id="user-name">Família</b><small id="user-mail">modo local</small></div>
      </div>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="wrapper">
    <div class="content">
      <header class="topbar">
        <div>
          <p class="topbar-hello" id="topbar-hello">Finanças da Família</p>
          <h1 class="topbar-month" id="topbar-month">—</h1>
        </div>
        <div class="topbar-actions">
          <button class="btn-new-desktop" id="btn-new-desktop"><span data-ico="plus"></span>Novo lançamento</button>
          <button class="icon-btn" id="btn-sync" title="Sincronizar" aria-label="Sincronizar"><span data-ico="sync"></span></button>
          <button class="icon-btn" id="btn-config" title="Configurações" aria-label="Configurações"><span data-ico="settings"></span></button>
        </div>
      </header>

      <p id="sync-status" class="sync-status" hidden></p>

      <main id="view" class="view"><!-- renderizado por app.js --></main>
    </div>

    <nav class="tabbar" aria-label="Navegação principal">
      <button data-tab="inicio" class="tab active"><span class="tab-ico" data-ico="home"></span><span>Início</span></button>
      <button data-tab="extrato" class="tab"><span class="tab-ico" data-ico="list"></span><span>Extrato</span></button>
      <button id="fab" class="fab" aria-label="Lançar gasto"><span data-ico="plus"></span></button>
      <button data-tab="cartoes" class="tab"><span class="tab-ico" data-ico="card"></span><span>Cartões</span></button>
      <button data-tab="metas" class="tab"><span class="tab-ico" data-ico="target"></span><span>Metas</span></button>
    </nav>
  </div>
</div>

<!-- Tela de bloqueio / segurança -->
<div id="lock" class="lock" hidden></div>

<!-- Folha de lançamento rápido -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="Lançamento rápido"></section>

<!-- Modal genérico (config, edições) -->
<div id="modal-backdrop" class="modal-backdrop" hidden></div>
<section id="modal" class="modal" hidden></section>

<!-- role/aria-live: o toast é o único canal de erro de validação do app. Sem isto,
     quem usa leitor de tela tenta salvar, o formulário não fecha e nada é dito. -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js?v=151"></script>
<!-- ApexCharts v3.54.1 (MIT), vendorizado: o app e offline-first e CDN quebraria
     o uso sem rede. Vem antes de app.js, que o usa ao desenhar. -->
<script src="vendor/apexcharts.min.js?v=151"></script>
<script src="js/icons.js?v=151"></script>
<script src="js/ui.js?v=151"></script>
<script src="js/graficos.js?v=151"></script>
<script src="js/ofx.js?v=151"></script>
<script src="js/db.js?v=151"></script>
<script src="js/sync.js?v=151"></script>
<script src="js/auth.js?v=151"></script>
<script src="js/app.js?v=151"></script>
<script>
  if ('serviceWorker' in navigator) {
    /* REGISTRAR NÃO BASTA NUM APP INSTALADO: o navegador só procura versão nova em uma
       NAVEGAÇÃO, e um app instalado quase nunca navega — sai-se pelo botão do aparelho
       e volta-se pelo ícone, o que é apenas retomar. Este worker já é rede-primeiro,
       então o conteúdo vem novo; o que faltava era alguém PERGUNTAR se há versão nova
       enquanto o app fica semanas aberto em segundo plano. */
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        const olhar = () => { if (!document.hidden) reg.update().catch(() => {}); };
        document.addEventListener('visibilitychange', olhar);
      }).catch(() => {});
    });
    // Quando uma versão nova assume o controle, recarrega uma vez para não ficar
    // metade da aplicação antiga e metade nova.
    let recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregou) return;
      recarregou = true;
      location.reload();
    });
  }
</script>
</body>
</html>
