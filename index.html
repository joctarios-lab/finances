<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOMI — Finanças da Família</title>
<meta name="description" content="As contas da casa, em um lugar só — offline, rápido e sincronizado.">
<!-- A cor da barra do sistema acompanha o tema: carbono no escuro, creme no claro.
     Sem os dois, um app instalado em tema claro abre com a faixa preta do escuro. -->
<meta name="theme-color" content="#070A12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Figtree carrega a marca e os títulos; Inter fica com os valores, onde
     dígitos de largura fixa importam mais que personalidade. -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CSS da propria ApexCharts. O .min.js NAO o injeta: sem ele a dica de valor
     perde a caixa e o ancoramento (.apexcharts-canvas{position:relative}) e voa
     para o canto da pagina. Vem ANTES do nosso, para o nosso poder sobrepor. -->
<link rel="stylesheet" href="vendor/apexcharts.css?v=161">
<link rel="stylesheet" href="css/styles.css?v=161">
<script>
  /* TEMA ANTES DA PRIMEIRA PINTURA.

     O tema escolhido mora no localStorage, e lê-lo depois que app.js carrega
     significaria pintar a tela clara e trocar para escura no quadro seguinte —
     o "flash branco" que todo app de tema duplo tem quando essa decisão desce
     para o fim da fila. Este bloco é minúsculo e síncrono de propósito: ele
     precisa rodar antes de o body existir.

     Sem escolha gravada, nada é marcado e o CSS segue o prefers-color-scheme
     do sistema. */
  try {
    var _t = localStorage.getItem('financas.tema');
    if (_t === 'dark' || _t === 'light') document.documentElement.dataset.tema = _t;
    if (localStorage.getItem('financas.privacidade') === '1') document.documentElement.classList.add('privado');
  } catch (e) {}
</script>
</head>
<body>

<div id="app">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="icons/icon.svg" alt="">
      <div><b>DOMI</b><small id="side-family">Minha família</small></div>
    </div>
    <nav class="sidebar-menu">
      <p class="sidebar-section">Visão geral</p>
      <button class="side-item" data-tab="inicio"><span class="tab-ico" data-ico="home"></span>Painel</button>
      <button class="side-item" data-tab="relatorios"><span class="tab-ico" data-ico="pie"></span>Relatórios</button>
      <p class="sidebar-section">Movimentações</p>
      <button class="side-item" data-tab="extrato"><span class="tab-ico" data-ico="list"></span>Extrato</button>
      <button class="side-item" data-tab="cartoes"><span class="tab-ico" data-ico="card"></span>Cartões &amp; Faturas</button>
      <p class="sidebar-section">Planejamento</p>
      <button class="side-item" data-tab="metas"><span class="tab-ico" data-ico="target"></span>Metas</button>
      <button class="side-item" id="side-recorrencias"><span class="tab-ico" data-ico="calendar"></span>Contas fixas</button>
      <p class="sidebar-section">Cofrinho</p>
      <button class="side-item" id="side-criancas"><span class="tab-ico" data-ico="piggy"></span>Crianças</button>
      <p class="sidebar-section">Sistema</p>
      <button class="side-item" id="side-config"><span class="tab-ico" data-ico="settings"></span>Configurações</button>
      <button class="side-item" id="side-lock"><span class="tab-ico" data-ico="lock"></span>Bloquear</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">F</div>
        <div><b id="user-name">Família</b><small id="user-mail">modo local</small></div>
      </div>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="wrapper">
    <!-- HEADER GLOBAL, preso no topo em qualquer largura.

         Fora de .content de propósito, e em largura inteira: a faixa atravessa a
         tela para o desfoque cobrir tudo o que passa por baixo, e as ações ficam
         na borda direita, que é onde a mão as procura num monitor largo. -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <img class="topbar-logo" src="icons/icon.svg" alt="" width="30" height="30">
          <div class="topbar-ctx">
            <!-- A marca (DOMI · nome da família) e a tela atual. Os dois são
                 escritos pelo app: refreshIdentity() e setTab(). -->
            <p class="topbar-hello" id="topbar-hello">DOMI</p>
            <h1 class="topbar-month" id="topbar-month">Painel</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn-new-desktop" id="btn-new-desktop"><span data-ico="plus"></span>Novo lançamento</button>
          <button class="icon-btn only-desk" id="btn-ofx" title="Importar extrato OFX" aria-label="Importar extrato OFX"><span data-ico="download"></span></button>
          <!-- aria-pressed: o botão é um interruptor, e sem ele um leitor de tela
               anuncia "botão ocultar valores" sem dizer se já estão ocultos. -->
          <!-- O ASSISTENTE, quando ligado. Fica escondido por padrão: quem não
               configurou não vê botão nenhum, e o app segue idêntico ao de
               sempre. Quem o revela é pintarBotaoIA(), no boot. -->
          <button class="icon-btn" id="btn-ia" title="Assistente" aria-label="Assistente" hidden><span data-ico="sparkles"></span></button>
          <button class="icon-btn" id="btn-privacidade" title="Ocultar valores" aria-label="Ocultar valores" aria-pressed="false"><span data-ico="eye"></span></button>
          <!-- O ESTADO DA SINCRONIZAÇÃO MORA NO AVATAR.

               Ele era uma pastilha própria, com rótulo, ao lado do período — dois
               blocos permanentes gastando a barra inteira para dizer algo que,
               em 99% das aberturas, é "está tudo em dia". Agora é um ponto no
               canto do avatar: ausente quando não há nada a dizer, visível quando
               há. O avatar já leva a Configurações, que é onde a sincronização se
               resolve, então o toque continua caindo no lugar certo. -->
          <button class="avatar-btn" id="btn-perfil" title="Perfil e configurações" aria-label="Perfil e configurações">
            <span id="topbar-avatar">D</span>
            <i class="sync-dot" id="sync-dot" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="content">
      <p id="sync-status" class="sync-status" hidden></p>
      <main id="view" class="view"><!-- renderizado por app.js --></main>
    </div>

    <!-- Barra inferior (mobile): ilha flutuante com quatro atalhos.

         O botão de lançar fica FORA da barra no HTML, e não entre as abas: ele é
         `position: fixed` para poder transbordar por cima dela sem ser cortado
         pelo recorte da ilha. O `.tab-vao` é quem reserva o lugar dele no meio,
         para nenhuma aba encostar no botão. -->
    <nav class="tabbar" aria-label="Navegação principal">
      <button data-tab="inicio" class="tab active"><span class="tab-ico" data-ico="home"></span><span>Início</span></button>
      <button data-tab="extrato" class="tab"><span class="tab-ico" data-ico="list"></span><span>Extrato</span></button>
      <span class="tab-vao" aria-hidden="true"></span>
      <button data-tab="cartoes" class="tab"><span class="tab-ico" data-ico="card"></span><span>Cartões</span></button>
      <button data-tab="metas" class="tab"><span class="tab-ico" data-ico="target"></span><span>Metas</span></button>
    </nav>
    <button id="fab" class="fab" aria-label="Novo lançamento"><span data-ico="plus"></span></button>
  </div>
</div>

<!-- Tela de bloqueio / segurança -->
<div id="lock" class="lock" hidden></div>

<!-- Folha de lançamento rápido -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="Lançamento rápido"></section>

<!-- Modal genérico (config, edições) -->
<div id="modal-backdrop" class="modal-backdrop" hidden></div>
<section id="modal" class="modal" hidden></section>

<!-- role/aria-live: o toast é o único canal de erro de validação do app. Sem isto,
     quem usa leitor de tela tenta salvar, o formulário não fecha e nada é dito. -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js?v=161"></script>
<!-- ApexCharts v3.54.1 (MIT), vendorizado: o app e offline-first e CDN quebraria
     o uso sem rede. Vem antes de app.js, que o usa ao desenhar. -->
<script src="vendor/apexcharts.min.js?v=161"></script>
<script src="js/icons.js?v=161"></script>
<script src="js/ui.js?v=161"></script>
<script src="js/graficos.js?v=161"></script>
<script src="js/ofx.js?v=161"></script>
<script src="js/db.js?v=161"></script>
<script src="js/sync.js?v=161"></script>
<script src="js/ia.js?v=161"></script>
<script src="js/auth.js?v=161"></script>
<script src="js/app.js?v=161"></script>
<script>
  if ('serviceWorker' in navigator) {
    /* REGISTRAR NÃO BASTA NUM APP INSTALADO: o navegador só procura versão nova em uma
       NAVEGAÇÃO, e um app instalado quase nunca navega — sai-se pelo botão do aparelho
       e volta-se pelo ícone, o que é apenas retomar. Este worker já é rede-primeiro,
       então o conteúdo vem novo; o que faltava era alguém PERGUNTAR se há versão nova
       enquanto o app fica semanas aberto em segundo plano. */
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        const olhar = () => { if (!document.hidden) reg.update().catch(() => {}); };
        document.addEventListener('visibilitychange', olhar);
      }).catch(() => {});
    });
    // Quando uma versão nova assume o controle, recarrega uma vez para não ficar
    // metade da aplicação antiga e metade nova.
    let recarregou = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregou) return;
      recarregou = true;
      location.reload();
    });
  }
</script>
</body>
</html>
