<!-- Fredoka é redonda e cheia: é a forma de letra que criança em alfabetização
     reconhece mais rápido. Nunito vem junto como reserva, e se nenhuma das duas
     carregar (offline na primeira abertura) a pilha do sistema assume — a mesma
     ordem declarada em cofrinho.css, e há teste conferindo que as duas listas
     não se separem. Sem isso, o CSS pediria uma fonte que o HTML não busca, e o
     app abriria com a letra do sistema sem ninguém entender por quê. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/cofrinho.css?v=11">
</head>
