<script>
  setTimeout(() => {
    App.aba='cofrinho'; telaEscolha('guardar', 10, 'Sorvete', function(){});
    setTimeout(() => {
      const larg = document.documentElement.clientWidth;
      const out = ['ABA=escolha viewport=' + larg + ' scrollWidth=' + document.documentElement.scrollWidth];
      document.querySelectorAll('#app *').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width && (r.right > larg + 0.5 || r.left < -0.5)) {
          out.push('  ESTOURA ' + el.tagName + '.' + String(el.className || '').slice(0, 34)
            + ' left=' + Math.round(r.left) + ' right=' + Math.round(r.right));
        }
      });
      /* TEXTO CORTADO: caixa alta é mais larga, e o corte apareceria como reticências
         ou como palavra sumida — nao como estouro de layout. */
      document.querySelectorAll('#app *').forEach(el => {
        if (el.children.length === 0 && el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0) {
          out.push('  CORTA ' + el.tagName + '.' + String(el.className || '').slice(0, 34)
            + ' precisa=' + el.scrollWidth + ' tem=' + el.clientWidth
            + ' "' + (el.textContent || '').trim().slice(0, 28) + '"');
        }
      });
      document.body.innerHTML = '<pre id="R">' + out.join('\n') + '</pre>';
    }, 500);
  }, 400);
</script></body>
