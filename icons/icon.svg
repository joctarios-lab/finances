<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DOMI">
  <title>DOMI</title>
  <desc>O arco: a cúpula que abriga, sobre a base que sustenta. De domus — casa.</desc>

  <rect width="512" height="512" rx="128" fill="#2A52C9"/>

  <!-- A cúpula, em traço de pontas redondas. Traço e não massa: o arco vazado
       deixa o azul do fundo aparecer por dentro, e é isso que o faz ler como
       abrigo em vez de morro. -->
  <path d="M124 344 A132 132 0 0 1 388 344" fill="none" stroke="#FFFFFF"
        stroke-width="46" stroke-linecap="round"/>

  <!-- A base, em pílula: o chão que a cúpula protege -->
  <rect x="112" y="372" width="288" height="46" rx="23" fill="#FFFFFF"/>
</svg>
